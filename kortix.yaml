# yaml-language-server: $schema=https://kortix.com/schema/kortix.v3.schema.json
#
# agent-harness-comparison: the harness comparison as a project you can run.
#
# One agent re-reads each rival's own repository and documentation, rewrites
# the comparison table from what it finds, and opens a change request with the
# diff. The rule that governs what it may read is in this file, so widening it
# is a change a reviewer sees in the same diff as the work.
#
# Reference: https://kortix.com/docs/developers#kortixyaml-reference

default_agent: harness-auditor

project:
  name: agent-harness-comparison
  description: A source-cited comparison of agent harnesses, rebuilt from each project's own repository and docs, with the approval rule kept in the repository.

skills:
  harness-audit: skills/harness-audit

# The one outside system this project reads: the public GitHub API, for each
# project's own README and docs. No credential, because every source is public.
connectors:
  - slug: sources
    name: Public source reader
    provider: http
    base_url: https://api.github.com
    auth:
      type: none
    policy_sets:
      read-only:
        description: Reads a project's public repository and documentation. Never writes to it.
        policies:
          - match: "get_*"
            action: always_run
          - match: "*"
            action: block

# A call that no rule matches: a read runs, a write or a delete waits for a person.
policy:
  default_mode: risk

# Project rules run before any policy set, so no agent can loosen them.
policies:
  - match: "sources.*delete*"
    action: block

agents:
  harness-auditor:
    description: Re-reads each harness project's own repository and documentation, rewrites the comparison table from what it finds, and opens a change request with the diff.
    mode: primary
    permission: allow
    prompt_file: agents/harness-auditor.md
    tools: [read, grep, write, show]
    skills: [harness-audit]
    connectors: [sources]
    policy_sets:
      sources: read-only
    secrets: none
    kortix_permissions: all
    workspace: { project_repository: true }

triggers:
  - slug: monthly-harness-audit
    name: Monthly harness audit
    on:
      cron: "0 9 1 * *"
      timezone: UTC
    run:
      agent: harness-auditor
      prompt: Re-read every source in docs/sources.md, rewrite the comparison table in README.md from what each project's own repository and documentation now say, and open a change request with the diff. Do not merge it.
